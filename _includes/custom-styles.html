<!--
  Shared styles for the homepage and teaching page.
  Kept here rather than in _sass so a theme update won't overwrite them.
  Pull it into a page by putting the include tag near the top of the file.
-->
<style>
.lede {
  font-size: 1.22em;
  line-height: 1.55;
  max-width: 34em;
  margin: 0 0 1.6em 0;
}

/* Strands: no boxes, no shadows. A rule per strand. */
.strands {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 1.6em;
  margin: 2em 0;
}
.strand {
  border-top: 2px solid currentColor;
  padding-top: 0.7em;
}
.strand h3 {
  margin: 0 0 0.35em 0;
  font-size: 1em;
  line-height: 1.3;
}
.strand p {
  margin: 0;
  font-size: 0.9em;
  line-height: 1.5;
}

/* Entry lists: the date or year hangs in the left margin. */
.entries { margin: 1em 0 1.4em 0; }
.entry {
  display: grid;
  grid-template-columns: 5.5em 1fr;
  gap: 0 1.1em;
  padding: 0.75em 0;
  border-bottom: 1px solid rgba(128, 128, 128, 0.25);
}
.entry:first-child { border-top: 1px solid rgba(128, 128, 128, 0.25); }
.entry-when {
  font-size: 0.82em;
  line-height: 1.7;
  opacity: 0.7;
  font-variant-numeric: tabular-nums;
}
.entry-what { margin: 0; line-height: 1.5; }
.entry-what .venue {
  display: block;
  font-size: 0.85em;
  opacity: 0.7;
  margin-top: 0.15em;
}
.more { font-size: 0.9em; }

@media (max-width: 760px) {
  .strands { grid-template-columns: 1fr; gap: 1.2em; }
  .entry { grid-template-columns: 1fr; gap: 0.2em; }
  .entry-when { line-height: 1.4; }
}
</style>
